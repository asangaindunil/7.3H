global:
  scrape_interval:     15s
  evaluation_interval: 15s

# Send firing alerts to Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Load alerting rules
rule_files:
  - 'alert.rules.yml'

scrape_configs:

  # Spring Boot application metrics via Micrometer/Prometheus endpoint
  - job_name: 'task-management-api'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['app:8080']
        labels:
          environment: 'production'
          application: 'task-management-api'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
