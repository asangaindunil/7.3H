services:
  app:
    build: .
    image: asangaindunil/task-management-api:${DOCKER_TAG:-latest}
    container_name: task-management-api
    ports:
      - "8081:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taskdb
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 86400000

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - task-network

  postgres:
    image: postgres:15-alpine
    container_name: task-postgres

    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - task-network

  prometheus:
    image: prom/prometheus:latest
    container_name: task-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alert.rules.yml:/etc/prometheus/alert.rules.yml

    networks:
      - task-network

  grafana:
    image: grafana/grafana:latest
    container_name: task-grafana

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

    networks:
      - task-network

  alertmanager:
    image: prom/alertmanager:latest
    container_name: task-alertmanager

    ports:
      - "9093:9093"

    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml

    networks:
      - task-network

volumes:
  postgres_data:
  grafana_data:

networks:
  task-network:
    driver: bridge