spring.application.name=task-management-api
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/taskdb
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=4e9a8b2c1d7f3e6a0b5c8d2e9f4a7b3c6d1e8f2a5b9c3d7e0f4a8b2c6d9e1f3a
jwt.expiration=86400000

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# App Info
info.app.name=Smart Task Management API
info.app.version=1.0.0
info.app.description=Task management system for Deakin CI/CD project
